# Comprehensive Credential Issuer Metadata
# Includes all W3C VerifiableCredential types, EUDI credentials (mDoc + SD-JWT), and advanced types.
# This overrides the code-level defaults in CredentialTypeConfig.kt.
#
# Simple array entries auto-expand into format variants:
#   jwt_vc_json, jwt_vc_json_ld, sd_jwt_vc, dc+sd-jwt, vc_ld_json, ldp_vc
# Advanced object entries are used as-is (no expansion).

supportedCredentialTypes = {

    # ============================================================
    # W3C Verifiable Credentials (Simple Array Types)
    # ============================================================

    BankId = [VerifiableCredential, BankId]
    KycChecksCredential = [VerifiableCredential, VerifiableAttestation, KycChecksCredential]
    KycCredential = [VerifiableCredential, VerifiableAttestation, KycCredential]
    KycDataCredential = [VerifiableCredential, VerifiableAttestation, KycDataCredential]
    PassportCh = [VerifiableCredential, VerifiableAttestation, VerifiableId, PassportCh]
    PND91Credential = [VerifiableCredential, PND91Credential]
    MortgageEligibility = [VerifiableCredential, VerifiableAttestation, VerifiableId, MortgageEligibility]
    PortableDocumentA1 = [VerifiableCredential, VerifiableAttestation, PortableDocumentA1]
    OpenBadgeCredential = [VerifiableCredential, OpenBadgeCredential]
    VaccinationCertificate = [VerifiableCredential, VerifiableAttestation, VaccinationCertificate]
    WalletHolderCredential = [VerifiableCredential, WalletHolderCredential]
    UniversityDegree = [VerifiableCredential, UniversityDegree]
    VerifiableId = [VerifiableCredential, VerifiableAttestation, VerifiableId]
    CTWalletSameAuthorisedInTime = [VerifiableCredential, VerifiableAttestation, CTWalletSameAuthorisedInTime]
    CTWalletSameAuthorisedDeferred = [VerifiableCredential, VerifiableAttestation, CTWalletSameAuthorisedDeferred]
    CTWalletSamePreAuthorisedInTime = [VerifiableCredential, VerifiableAttestation, CTWalletSamePreAuthorisedInTime]
    CTWalletSamePreAuthorisedDeferred = [VerifiableCredential, VerifiableAttestation, CTWalletSamePreAuthorisedDeferred]
    InTimeIssuance = [VerifiableCredential, VerifiableAttestation, InTimeIssuance]
    DeferredIssuance = [VerifiableCredential, VerifiableAttestation, DeferredIssuance]
    PreAuthIssuance = [VerifiableCredential, VerifiableAttestation, PreAuthIssuance]
    AlpsTourReservation = [VerifiableCredential, VerifiableAttestation, AlpsTourReservation]
    EducationalID = [VerifiableCredential, VerifiableAttestation, EducationalID]
    HotelReservation = [VerifiableCredential, VerifiableAttestation, HotelReservation]
    IdentityCredential = [VerifiableCredential, VerifiableAttestation, IdentityCredential]
    Iso18013DriversLicenseCredential = [VerifiableCredential, VerifiableAttestation, Iso18013DriversLicenseCredential]
    TaxReceipt = [VerifiableCredential, VerifiableAttestation, TaxReceipt]
    VerifiablePortableDocumentA1 = [VerifiableCredential, VerifiableAttestation, VerifiablePortableDocumentA1]
    Visa = [VerifiableCredential, VerifiableAttestation, Visa]
    eID = [VerifiableCredential, VerifiableAttestation, eID]
    TaxCredential = [VerifiableCredential, TaxCredential]
    NaturalPersonVerifiableID = [VerifiableCredential, VerifiableAttestation, NaturalPersonVerifiableID]
    BoardingPass = [VerifiableCredential, VerifiableAttestation, BoardingPass]
    LegalPerson = [VerifiableCredential, LegalPerson]
    LegalRegistrationNumber = [VerifiableCredential, LegalRegistrationNumber]
    GaiaXTermsAndConditions = [VerifiableCredential, GaiaXTermsAndConditions]
    DataspaceParticipantCredential = [VerifiableCredential, DataspaceParticipantCredential]
    ProofOfAddressCredential = [VerifiableCredential, ProofOfAddressCredential]
    ePassportCredential = [VerifiableCredential, ePassportCredential]

    # ============================================================
    # Advanced W3C Credentials (Full CredentialSupported objects)
    # ============================================================

    "KiwiAccessCredential_jwt_vc_json" = {
        format = "jwt_vc_json"
        cryptographic_binding_methods_supported = ["did"]
        credential_signing_alg_values_supported = ["EdDSA", "ES256", "ES256K", "RSA"]
        proof_types_supported = { jwt = { proof_signing_alg_values_supported = ["ES256", "EdDSA", "ES256K", "RS256"] } }
        credential_definition = {
            type = ["VerifiableCredential", "VerifiableAttestation", "KiwiAccessCredential"]
        }
        display = [
            {
                name = "Kiwi Access Card"
                locale = "en-US"
                description = "An official evidence of age and identity card for use across New Zealand."
                logo = {
                    url = "https://kiwiaccess.co.nz/wp-content/uploads/2018/10/Kiwi-Access-Logo-White.png"
                    alt_text = "Logo"
                }
                background_color = "#FFFFFF"
                text_color = "#78350f"
                background_image = {
                    url = "https://e-com.demo.walt.id/img/credential-bg.png"
                    alt_text = "Background"
                }
            }
        ]
    }

    "identity_credential_vc+sd-jwt" = {
        format = "vc+sd-jwt"
        cryptographic_binding_methods_supported = ["jwk"]
        credential_signing_alg_values_supported = ["ES256"]
        proof_types_supported = { jwt = { proof_signing_alg_values_supported = ["ES256"] } }
        vct = "https://example.org/identity_credential"
        sdJwtVcTypeMetadata = {
            name = "Identity Credential"
            description = "The Identity Verifiable Credential"
        }
    }

    "my_custom_vct_vc+sd-jwt" = {
        format = "vc+sd-jwt"
        cryptographic_binding_methods_supported = ["did", "jwk"]
        credential_signing_alg_values_supported = ["ES256"]
        proof_types_supported = { jwt = { proof_signing_alg_values_supported = ["ES256"] } }
        vct = "https://example.com/my_custom_vct"
        sdJwtVcTypeMetadata = {
            name = "Custom VCT Example"
            description = "Example to show custom VCT registries. Not intended for production use."
        }
    }

    "photoID_credential_vc+sd-jwt" = {
        format = "vc+sd-jwt"
        cryptographic_binding_methods_supported = ["jwk"]
        credential_signing_alg_values_supported = ["ES256"]
        proof_types_supported = { jwt = { proof_signing_alg_values_supported = ["ES256"] } }
        vct = "PhotoIDCredential"
        sdJwtVcTypeMetadata = {
            name = "PhotoID VC (ISO 23220-4)"
            description = "SD-JWT Verifiable Credential based on Photo ID schema 1.0 (ISO 23220-4 compliant)"
        }
        credential_definition = {
            type = ["VerifiableCredential", "VerifiableAttestation", "PhotoIDCredential"]
        }
    }

    # ============================================================
    # EUDI-Compliant mDoc Credentials (ISO 18013-5)
    # ============================================================

    "eu.europa.ec.eudi.pid.1" = {
        format = mso_mdoc
        cryptographic_binding_methods_supported = ["cose_key"]
        credential_signing_alg_values_supported = ["ES256"]
        proof_types_supported = { jwt = { proof_signing_alg_values_supported = ["ES256"] } }
        doctype = "eu.europa.ec.eudi.pid.1"
        display = [
            {
                name = "EU Personal ID (mDoc)"
                locale = "en"
                logo = { url = "https://example.com/pid-logo.png", alt_text = "PID Logo" }
            }
        ]
        claims = {
            "eu.europa.ec.eudi.pid.1" = {
                family_name = { mandatory = true, display = [{ name = "Family Name", locale = "en" }] }
                given_name = { mandatory = true, display = [{ name = "Given Name", locale = "en" }] }
                birth_date = { mandatory = true, display = [{ name = "Date of Birth", locale = "en" }] }
                age_over_18 = { mandatory = false, display = [{ name = "Age Over 18", locale = "en" }] }
                issuance_date = { mandatory = true, display = [{ name = "Issuance Date", locale = "en" }] }
                expiry_date = { mandatory = true, display = [{ name = "Expiry Date", locale = "en" }] }
                issuing_authority = { mandatory = true, display = [{ name = "Issuing Authority", locale = "en" }] }
                issuing_country = { mandatory = true, display = [{ name = "Issuing Country", locale = "en" }] }
                nationality = { mandatory = false, display = [{ name = "Nationality", locale = "en" }] }
            }
        }
    }

    "org.iso.18013.5.1.mDL" = {
        format = mso_mdoc
        cryptographic_binding_methods_supported = ["cose_key"]
        credential_signing_alg_values_supported = ["ES256"]
        proof_types_supported = { jwt = { proof_signing_alg_values_supported = ["ES256"] } }
        doctype = "org.iso.18013.5.1.mDL"
        display = [
            {
                name = "Mobile Driving License"
                locale = "en"
                logo = { url = "https://example.com/mdl-logo.png", alt_text = "mDL Logo" }
            }
        ]
        claims = {
            "org.iso.18013.5.1" = {
                family_name = { mandatory = true, display = [{ name = "Family Name", locale = "en" }] }
                given_name = { mandatory = true, display = [{ name = "Given Name", locale = "en" }] }
                birth_date = { mandatory = true, display = [{ name = "Date of Birth", locale = "en" }] }
                issue_date = { mandatory = true, display = [{ name = "Issue Date", locale = "en" }] }
                expiry_date = { mandatory = true, display = [{ name = "Expiry Date", locale = "en" }] }
                issuing_country = { mandatory = true, display = [{ name = "Issuing Country", locale = "en" }] }
                issuing_authority = { mandatory = true, display = [{ name = "Issuing Authority", locale = "en" }] }
                document_number = { mandatory = true, display = [{ name = "Document Number", locale = "en" }] }
                portrait = { mandatory = false, display = [{ name = "Portrait", locale = "en" }] }
                driving_privileges = { mandatory = true, display = [{ name = "Driving Privileges", locale = "en" }] }
            }
        }
    }

    # ============================================================
    # EUDI-Compliant SD-JWT Credentials
    # ============================================================

    "urn:eudi:pid:1" = {
        format = "dc+sd-jwt"
        cryptographic_binding_methods_supported = ["jwk"]
        credential_signing_alg_values_supported = ["ES256"]
        proof_types_supported = { jwt = { proof_signing_alg_values_supported = ["ES256"] } }
        vct = "urn:eudi:pid:1"
        display = [
            {
                name = "EU Personal ID (SD-JWT)"
                locale = "en"
                logo = { url = "https://example.com/pid-logo.png", alt_text = "PID Logo" }
            }
        ]
        credentialSubject = {
            family_name = { mandatory = true, display = [{ name = "Family Name", locale = "en" }] }
            given_name = { mandatory = true, display = [{ name = "Given Name", locale = "en" }] }
            birth_date = { mandatory = true, display = [{ name = "Date of Birth", locale = "en" }] }
            age_over_18 = { mandatory = false, display = [{ name = "Age Over 18", locale = "en" }] }
            issuance_date = { mandatory = true, display = [{ name = "Issuance Date", locale = "en" }] }
            expiry_date = { mandatory = true, display = [{ name = "Expiry Date", locale = "en" }] }
            issuing_authority = { mandatory = true, display = [{ name = "Issuing Authority", locale = "en" }] }
            issuing_country = { mandatory = true, display = [{ name = "Issuing Country", locale = "en" }] }
            nationality = { mandatory = false, display = [{ name = "Nationality", locale = "en" }] }
        }
    }

    # ============================================================
    # Payment Wallet Attestation (EWC RFC007)
    # Feature-flagged: only active when PWA_ENABLED=true
    # ============================================================

    "PaymentWalletAttestation" = {
        format = "dc+sd-jwt"
        cryptographic_binding_methods_supported = ["jwk"]
        credential_signing_alg_values_supported = ["ES256"]
        proof_types_supported = { jwt = { proof_signing_alg_values_supported = ["ES256"] } }
        vct = "PaymentWalletAttestation"
        display = [
            {
                name = "Payment Wallet Attestation"
                locale = "en"
                description = "Attestation binding a payment funding source to this wallet"
                logo = { url = "https://example.com/pwa-logo.png", alt_text = "PWA Logo" }
            }
        ]
        credentialSubject = {
            funding_source = { mandatory = true, display = [{ name = "Funding Source", locale = "en" }] }
            "funding_source.type" = { mandatory = true, display = [{ name = "Type", locale = "en" }] }
            "funding_source.panLastFour" = { mandatory = false, display = [{ name = "Card Last 4", locale = "en" }] }
            "funding_source.iin" = { mandatory = false, display = [{ name = "Card Issuer", locale = "en" }] }
            "funding_source.ibanLastFour" = { mandatory = false, display = [{ name = "IBAN Last 4", locale = "en" }] }
            "funding_source.bic" = { mandatory = false, display = [{ name = "BIC", locale = "en" }] }
            "funding_source.scheme" = { mandatory = false, display = [{ name = "Payment Scheme", locale = "en" }] }
            "funding_source.currency" = { mandatory = false, display = [{ name = "Currency", locale = "en" }] }
            "funding_source.icon" = { mandatory = false, display = [{ name = "Icon", locale = "en" }] }
            "funding_source.aliasId" = { mandatory = false, display = [{ name = "Alias ID", locale = "en" }] }
        }
    }
}
