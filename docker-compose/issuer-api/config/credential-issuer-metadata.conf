# Credential Issuer Metadata
# This overrides the code-level defaults in CredentialTypeConfig.kt.
#
# Only "advanced" object entries are used — each specifies an explicit format
# (jwt_vc_json, vc+sd-jwt, dc+sd-jwt, mso_mdoc) so no auto-expansion occurs.
#
# NOTE: "Simple array" entries were removed because they auto-expand into
# format variants including ldp_vc and jwt_vc_json-ld, which require an
# @context field in credential_definition. The EUDI wallet strictly validates
# ALL entries in credential_configurations_supported and crashes if any
# JSON-LD entry is missing @context.

supportedCredentialTypes = {

    # ============================================================
    # W3C Credentials (Full CredentialSupported objects)
    # ============================================================

    "KiwiAccessCredential_jwt_vc_json" = {
        format = "jwt_vc_json"
        cryptographic_binding_methods_supported = ["did"]
        credential_signing_alg_values_supported = ["EdDSA", "ES256", "ES256K", "RSA"]
        proof_types_supported = { jwt = { proof_signing_alg_values_supported = ["ES256", "EdDSA", "ES256K", "RS256"] } }
        credential_definition = {
            type = ["VerifiableCredential", "VerifiableAttestation", "KiwiAccessCredential"]
        }
        display = [
            {
                name = "Kiwi Access Card"
                locale = "en-US"
                description = "An official evidence of age and identity card for use across New Zealand."
                logo = {
                    url = "https://kiwiaccess.co.nz/wp-content/uploads/2018/10/Kiwi-Access-Logo-White.png"
                    alt_text = "Logo"
                }
                background_color = "#FFFFFF"
                text_color = "#78350f"
                background_image = {
                    url = "https://e-com.demo.walt.id/img/credential-bg.png"
                    alt_text = "Background"
                }
            }
        ]
    }

