enabled = false
enabled = ${?TRUST_LISTS_ENABLED}

etsi {
    # Use issuer registrar's dynamic LOTL — auto-discovers all tenant countries
    lotlUrl = "http://issuer-api:7002/admin/issuer/lotl.xml"
    lotlUrl = ${?ETSI_LOTL_URL}
    cacheTtlHours = 24
    memberStates = ["*"]
    validateSignatures = false
    additionalTslUrls {
    }
    cacheDir = "/waltid-verifier-api2/data/tsl-cache"
    refreshIntervalHours = 1
}

openidFederation {
    # Enable OpenID Federation trust source
    enabled = false
    enabled = ${?OPENID_FEDERATION_ENABLED}

    # Trust anchor entity IDs (federation roots)
    trustAnchors = []
    # Example: trustAnchors = ["https://trust-anchor.example.com"]

    # Maximum trust chain depth (default: 5)
    maxChainDepth = 5

    # Cache TTL in seconds for entity statements (default: 3600 = 1 hour)
    cacheTtlSeconds = 3600
}
