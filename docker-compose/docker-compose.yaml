services:
  wallet-api:
    image: ${IMAGE_PREFIX}waltid/wallet-api:${VERSION_TAG:-latest}
    profiles:
      - services
      - identity
      - all
    pull_policy: missing
    depends_on:
      postgres:
        condition: service_healthy
      caddy:
        condition: service_started
    env_file:
      - .env
    extra_hosts:
      - "$SERVICE_HOST:host-gateway"
      - "waltid.enterprise.localhost:host-gateway"
    volumes:
      - ./wallet-api/config:/waltid-wallet-api/config
      - ./wallet-api/data:/waltid-wallet-api/data

  issuer-api:
    image: ${IMAGE_PREFIX}waltid/issuer-api:${VERSION_TAG:-latest}
    profiles:
      - services
      - identity
      - all
    pull_policy: missing
    depends_on:
      - caddy
      - keycloak
    env_file:
      - .env
      - path: .env.local
        required: false
    # PWA (Payment Wallet Attestation) environment variables are loaded from .env.local
    # To enable: echo "PWA_ENABLED=true" >> .env.local
    environment:
      ISSUER_REGISTRAR_ENABLED: ${ISSUER_REGISTRAR_ENABLED:-false}
      STATUS_LISTS_ENABLED: ${STATUS_LISTS_ENABLED:-false}
    volumes:
      - ./issuer-api/config:/waltid-issuer-api/config

  verifier-api:
    image: ${IMAGE_PREFIX}waltid/verifier-api:${VERSION_TAG:-latest}
    profiles:
      - services
      - identity
      - all
    pull_policy: missing
    depends_on:
      - caddy
    env_file:
      - .env
    volumes:
      - ./verifier-api/config:/waltid-verifier-api/config
    environment:
      OPA_SERVER_URL: "http://opa-server:8181"

  verifier-api2:
    image: ${IMAGE_PREFIX}waltid/verifier-api2:${VERSION_TAG:-latest}
    profiles:
      - services
      - identity
      - verify-api  # Required by verify-api service
      - all
    pull_policy: missing
    depends_on:
      - caddy
    env_file:
      - .env
    extra_hosts:
      - "$SERVICE_HOST:host-gateway"
    # Re-import Caddy's root CA on every start so cert rotations (and
    # plain container restarts where the caddy-local alias persists) pick
    # up the current cert. Fails loudly rather than silently if the mount
    # or password is wrong — revocation checks cannot work without this.
    entrypoint:
      - /bin/sh
      - -c
      - |-
        keytool -delete -cacerts -storepass changeit -alias caddy-local 2>/dev/null || true
        if keytool -import -trustcacerts -cacerts -storepass changeit -noprompt -alias caddy-local -file /etc/ssl/certs/caddy-root-ca.crt; then
          echo "[entrypoint] caddy-local root CA imported into JVM truststore"
        else
          echo "[entrypoint] FAILED to import caddy root CA" >&2
          exit 1
        fi
        exec java -cp @/app/jib-classpath-file id.walt.openid4vp.verifier.MainKt
    environment:
      RP_REGISTRAR_ENABLED: ${RP_REGISTRAR_ENABLED:-false}
    volumes:
      - ./verifier-api2/config:/waltid-verifier-api2/config
      - verifier-api2-data:/waltid-verifier-api2/data
      - ./caddy-root-ca.crt:/etc/ssl/certs/caddy-root-ca.crt:ro


  waltid-demo-wallet:
    image: ${IMAGE_PREFIX}waltid/waltid-demo-wallet:${VERSION_TAG:-latest}
    profiles:
      - apps
      - identity
      - all
    pull_policy: missing
    build:
      context: ../
      dockerfile: waltid-applications/waltid-web-wallet/apps/waltid-demo-wallet/Dockerfile
    depends_on:
      - wallet-api
      - caddy
    environment:
      NUXT_PUBLIC_ISSUER_CALLBACK_URL: "http://$SERVICE_HOST:$DEMO_WALLET_FRONTEND_PORT"
      NUXT_PUBLIC_DEV_WALLET_URL: "http://$SERVICE_HOST:$DEV_WALLET_FRONTEND_PORT"
      NUXT_PUBLIC_MT_WALLET_ENABLED: "${MT_WALLET_ENABLED:-false}"
      PORT: $DEMO_WALLET_FRONTEND_PORT

  waltid-dev-wallet:
    image: ${IMAGE_PREFIX}waltid/waltid-dev-wallet:${VERSION_TAG:-latest}
    profiles:
      - apps
      - identity
      - all
    pull_policy: missing
    build:
      context: ../
      dockerfile: waltid-applications/waltid-web-wallet/apps/waltid-dev-wallet/Dockerfile
    depends_on:
      - wallet-api
      - caddy
    environment:
      NUXT_PUBLIC_ISSUER_CALLBACK_URL: "http://$SERVICE_HOST:$DEV_WALLET_FRONTEND_PORT"
      NUXT_PUBLIC_DEMO_WALLET_URL: "http://$SERVICE_HOST:$DEMO_WALLET_FRONTEND_PORT"
      NUXT_PUBLIC_MT_WALLET_ENABLED: "${MT_WALLET_ENABLED:-false}"
      PORT: $DEV_WALLET_FRONTEND_PORT

  web-portal:
    image: ${IMAGE_PREFIX}waltid/portal:${VERSION_TAG:-latest}
    profiles:
      - apps
      - identity
      - all
    pull_policy: missing
    build:
      context: ../
      dockerfile: waltid-applications/waltid-web-portal/Dockerfile
      args:
        NEXT_PUBLIC_VC_REPO: "${VC_REPO_EXTERNAL_URL:-http://$SERVICE_HOST:$VC_REPO_PORT}"
        NEXT_PUBLIC_ISSUER: "http://$SERVICE_HOST:$ISSUER_API_PORT"
        NEXT_PUBLIC_VERIFIER: "http://$SERVICE_HOST:$VERIFIER_API_PORT"
        NEXT_PUBLIC_VERIFIER2: "http://$SERVICE_HOST:$VERIFIER_API2_PORT"
        NEXT_PUBLIC_WALLET: "${WALLET_EXTERNAL_URL:-http://$SERVICE_HOST:$DEMO_WALLET_FRONTEND_PORT}"
        NEXT_PUBLIC_VERIFIER2_CLIENT_ID: "${NEXT_PUBLIC_VERIFIER2_CLIENT_ID:-}"
        NEXT_PUBLIC_VERIFIER2_SIGNING_KEY: "${NEXT_PUBLIC_VERIFIER2_SIGNING_KEY:-}"
        NEXT_PUBLIC_VERIFIER2_X5C: "${NEXT_PUBLIC_VERIFIER2_X5C:-}"
        NEXT_PUBLIC_ISSUER_REGISTRAR_ENABLED: "${ISSUER_REGISTRAR_ENABLED:-false}"
        NEXT_PUBLIC_RP_REGISTRAR_ENABLED: "${RP_REGISTRAR_ENABLED:-false}"
        NEXT_PUBLIC_STATUS_LISTS_ENABLED: "${STATUS_LISTS_ENABLED:-false}"
    depends_on:
      - caddy
    environment:
      NEXT_PUBLIC_VC_REPO: "${VC_REPO_EXTERNAL_URL:-http://$SERVICE_HOST:$VC_REPO_PORT}"
      # Portal uses HTTPS URLs for browser-facing calls (via ngrok)
      # These override ISSUER/VERIFIER_EXTERNAL_URL which are now Docker-internal
      NEXT_PUBLIC_ISSUER: "${ISSUER_EXTERNAL_HTTPS_URL:-https://issuer.theaustraliahack.com}"
      NEXT_PUBLIC_VERIFIER: "${VERIFIER_EXTERNAL_HTTPS_URL:-https://verifier.theaustraliahack.com}"
      NEXT_PUBLIC_VERIFIER2: "${VERIFIER2_EXTERNAL_HTTPS_URL:-https://verifier2.theaustraliahack.com}"
      # Server-side (Next.js API routes) talks to backends on the Docker network
      # so it doesn't need to trust Caddy's internal TLS CA.
      ISSUER_INTERNAL_URL: "http://issuer-api:${ISSUER_API_PORT:-7002}"
      VERIFIER_INTERNAL_URL: "http://verifier-api:${VERIFIER_API_PORT:-7003}"
      VERIFIER2_INTERNAL_URL: "http://verifier-api2:${VERIFIER_API2_PORT:-7004}"
      NEXT_PUBLIC_WALLET: "${WALLET_EXTERNAL_URL:-http://$SERVICE_HOST:$DEMO_WALLET_FRONTEND_PORT}"
      NEXT_PUBLIC_VERIFIER2_CLIENT_ID: "${NEXT_PUBLIC_VERIFIER2_CLIENT_ID:-}"
      NEXT_PUBLIC_VERIFIER2_SIGNING_KEY: "${NEXT_PUBLIC_VERIFIER2_SIGNING_KEY:-}"
      NEXT_PUBLIC_VERIFIER2_X5C: "${NEXT_PUBLIC_VERIFIER2_X5C:-}"
      NEXT_PUBLIC_ISSUER_REGISTRAR_ENABLED: "${ISSUER_REGISTRAR_ENABLED:-false}"
      NEXT_PUBLIC_RP_REGISTRAR_ENABLED: "${RP_REGISTRAR_ENABLED:-false}"
      NEXT_PUBLIC_STATUS_LISTS_ENABLED: "${STATUS_LISTS_ENABLED:-false}"
      NEXT_PUBLIC_PORTAL_CALLBACK_URL: "${PORTAL_CALLBACK_URL:-http://caddy:$WEB_PORTAL_PORT}"
      PORT: $WEB_PORTAL_PORT

  vc-repo:
    platform: linux/amd64
    image: ${IMAGE_PREFIX}waltid/vc-repository:${VERSION_VC_REPO:-latest}
    profiles:
      - services
      - identity
      - all
    pull_policy: missing
    build:
      context: ../waltid-applications/waltid-credentials/.
    depends_on:
      - caddy
    environment:
      PORT: $VC_REPO_PORT

  valkey:
    image: valkey/valkey:${VERSION_VALKEY:-7.2}
    profiles:
      - valkey
      - verify-api  # Required by verify-api service
      - all
    container_name: valkey
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: always
    command: ["valkey-server", "--bind", "0.0.0.0", "--port", "6379"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data

  postgres:
    image: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -q -U $$POSTGRES_USER" ]
      interval: 5s
      timeout: 1s
      retries: 5
    restart: always
    environment:
      POSTGRES_DB: $DB_NAME
      POSTGRES_USER: $DB_USERNAME
      POSTGRES_PASSWORD: $DB_PASSWORD
    volumes:
      - wallet-api-db:/waltid-wallet-api/data
    ports:
      - $POSTGRES_DB_PORT:5432 #TODO: tcp/udp proxy with caddy

  vault:
    image: hashicorp/vault:${VERSION_VAULT:-latest}
    profiles:
      - tse
      - all
    container_name: vault
    healthcheck:
      test: ["CMD-SHELL", "vault status || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 5
    volumes:
      - ./vault/config.hcl:/vault/config/config.hcl
      - vault_data:/vault/file
    ports:
      - "$VAULT_PORT:8200"
    environment:
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:$VAULT_PORT"
      VAULT_ADDR: "http://127.0.0.1:$VAULT_PORT"
    command: server -config=/vault/config/config.hcl -dev -dev-root-token-id="dev-only-token"
    restart: always

  vault-init:
    image: hashicorp/vault:${VERSION_VAULT:-latest}
    profiles:
      - tse
      - all
    container_name: vault-init
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dev-only-token"
      VAULT_ADDR: "http://vault:$VAULT_PORT"
    depends_on:
      vault:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "/vault/scripts/init.sh"]
    volumes:
      - ./vault/init.sh:/vault/scripts/init.sh

  opa-server:
    platform: linux/amd64
    image: openpolicyagent/opa:${VERSION_OPA:-latest}
    container_name: opa-server
    profiles:
      - opa
      - all
    ports:
      - "$OPA_SERVER_PORT:8181"
    command: [ "run", "--server", "--addr", ":8181" ]
    extra_hosts:
      - "$SERVICE_HOST:host-gateway"

  caddy:
    image: docker.io/caddy:2
    restart: unless-stopped
    env_file:
      - .env
    cap_add:
      - NET_ADMIN
    ports:

      - target: "$WALLET_BACKEND_PORT"
        published: $WALLET_BACKEND_PORT # wallet-api
        protocol: tcp
        mode: host

      - target: "$ISSUER_API_PORT"
        published: $ISSUER_API_PORT # issuer-api
        protocol: tcp
        mode: host

      - target: "$VERIFIER_API_PORT"
        published: $VERIFIER_API_PORT # verifier-api
        protocol: tcp
        mode: host

      - target: "$VERIFIER_API2_PORT"
        published: $VERIFIER_API2_PORT # verifier-api2
        protocol: tcp
        mode: host

      - target: "$DEMO_WALLET_FRONTEND_PORT"
        published: $DEMO_WALLET_FRONTEND_PORT # waltid-demo-wallet
        protocol: tcp
        mode: host

      - target: "$DEV_WALLET_FRONTEND_PORT"
        published: $DEV_WALLET_FRONTEND_PORT # waltid-dev-wallet
        protocol: tcp
        mode: host

      - target: "$WEB_PORTAL_PORT"
        published: $WEB_PORTAL_PORT # web-portal
        protocol: tcp
        mode: host

      - target: "$VC_REPO_PORT"
        published: $VC_REPO_PORT # vc-repo
        protocol: tcp
        mode: host

      - target: "$PG_ADMIN_PORT"
        published: $PG_ADMIN_PORT # pg-admin
        protocol: tcp
        mode: host

      - target: "${VERIFY_API_PORT:-7010}"
        published: ${VERIFY_API_PORT:-7010} # verify-api
        protocol: tcp
        mode: host

      - target: "${VERIFY_PORTAL_PORT:-7011}"
        published: ${VERIFY_PORTAL_PORT:-7011} # verify-portal
        protocol: tcp
        mode: host

    networks:
      default:
        aliases:
          - issuer.theaustraliahack.com
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./issuer-api/tsl.xml:/etc/caddy/tsl/tsl.xml:ro
# ==================================================
# VERIFY API - NEW FEATURE-FLAGGED SERVICE
# ==================================================
# This service is COMPLETELY SEPARATE from existing services.
# It requires explicit opt-in via --profile verify-api
# ==================================================
  verify-api:
    image: ${IMAGE_PREFIX}waltid/verify-api:${VERSION_TAG:-latest}
    profiles:
      - verify-api    # SEPARATE PROFILE - not part of 'identity' or 'services'
      - all
    pull_policy: missing
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      verifier-api2:
        condition: service_started
      caddy:
        condition: service_started
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      VERIFY_API_ENABLED: ${VERIFY_API_ENABLED:-false}
      DATABASE_URL: "jdbc:postgresql://postgres:5432/${DB_NAME}"
      DATABASE_USER: "${DB_USERNAME}"
      DATABASE_PASSWORD: "${DB_PASSWORD}"
      VALKEY_URL: "redis://valkey:6379"
      VERIFIER_API2_URL: "http://verifier-api2:7004"
      PUBLIC_BASE_URL: "${VERIFY_API_EXTERNAL_URL:-http://$SERVICE_HOST:$VERIFY_API_PORT}"
      RP_THEAUSTRALIAHACK_ID: "${RP_THEAUSTRALIAHACK_ID:-}"
    volumes:
      - ./verify-api/config:/waltid-verify-api/config

# ==================================================
# VERIFY PORTAL - Admin/Management UI for Verify API
# ==================================================
# Next.js portal for managing verification templates,
# API keys, and monitoring usage.
# External: https://verify-portal.theaustraliahack.com
# Local: http://localhost:7011
# ==================================================
  verify-portal:
    build:
      context: ../waltid-applications/waltid-verify-portal
      dockerfile: Dockerfile
    profiles:
      - verify-api
      - all
    depends_on:
      verify-api:
        condition: service_started
      caddy:
        condition: service_started
    environment:
      NEXT_PUBLIC_VERIFY_API_URL: "${VERIFY_API_EXTERNAL_URL:-http://localhost:7010}"
    # Port 7011 is exposed via Caddy reverse proxy, no direct host mapping needed
    expose:
      - "3001"

# ==================================================
# RP DEMOS - Relying Party Integration Examples
# ==================================================
# These demos show how to integrate with Verify API.
# IMPORTANT: Only run ONE demo at a time as they share
# the same domain (rp.theaustraliahack.com) via Caddy.
#
# Widget Demo: docker compose --profile rp-widget-demo up
# Next.js Demo: docker compose --profile rp-nextjs-demo up
# ==================================================

# RP Widget Demo - Minimal Express server with Widget SDK
# Uses the JavaScript Widget SDK for frontend-only integration
  rp-widget-demo:
    container_name: rp-widget-example-1
    build:
      context: ../examples/rp-widget-demo
      dockerfile: Dockerfile
    profiles:
      - rp-widget-demo
    depends_on:
      verify-api:
        condition: service_started
      caddy:
        condition: service_started
    environment:
      # Server-to-server API calls (Docker internal)
      VERIFY_API_URL: "http://verify-api:7010"
      # Browser SDK loading (must be publicly accessible)
      PUBLIC_VERIFY_API_URL: "${VERIFY_API_EXTERNAL_URL:-http://localhost:7010}"
      VERIFY_API_KEY: "${VERIFY_API_KEY:-vfy_test_sandbox_demo_key_12345678}"
      # Registered RP configuration (from verifier-api2 RP Registrar)
      RP_ID: "${RP_THEAUSTRALIAHACK_ID:-}"
      RP_CLIENT_ID: "x509_san_dns:rp.theaustraliahack.com"
      RP_DOMAIN: "rp.theaustraliahack.com"
      # Verifier API2 internal URL (for proxying wallet VP token responses)
      VERIFIER_API2_URL: "http://verifier-api2:${VERIFIER_API2_PORT:-7004}"
      PORT: 4000
      # OIDC RP login — unset RP_THEAUSTRALIAHACK_SECRET to disable.
      # Both OPs are configured simultaneously; the UI offers both buttons.
      KEYCLOAK_ISSUER: "${RP_KEYCLOAK_ISSUER:-}"
      KEYCLOAK_CLIENT_ID: "${RP_KEYCLOAK_CLIENT_ID:-}"
      KEYCLOAK_CLIENT_SECRET: "${RP_THEAUSTRALIAHACK_SECRET:-}"
      AUTHOP_ISSUER: "${RP_AUTHOP_ISSUER:-}"
      AUTHOP_CLIENT_ID: "${RP_KEYCLOAK_CLIENT_ID:-}"
      AUTHOP_CLIENT_SECRET: "${RP_THEAUSTRALIAHACK_SECRET:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      PUBLIC_BASE_URL: "${RP_EXTERNAL_URL:-http://localhost:4000}"
      NODE_ENV: "${NODE_ENV:-production}"
    ports:
      - "${RP_WIDGET_PORT:-4000}:4000"

# RP Next.js Demo - Full Next.js application
# Shows server-side API integration patterns
  rp-nextjs-demo:
    container_name: rp-nextjs-example-1
    build:
      context: ../examples/rp-web-nextjs
      dockerfile: Dockerfile
    profiles:
      - rp-nextjs-demo
    depends_on:
      verify-api:
        condition: service_started
      caddy:
        condition: service_started
    environment:
      VERIFY_API_URL: "http://verify-api:7010"
      VERIFY_API_KEY: "${VERIFY_API_KEY:-vfy_test_sandbox_demo_key_12345678}"
      NEXT_PUBLIC_VERIFY_API_URL: "${RP_EXTERNAL_URL:-https://rp.theaustraliahack.com}"
      # OIDC RP login (Auth.js v5) — unset RP_THEAUSTRALIAHACK_SECRET to disable.
      # Two providers are configured side-by-side:
      #   - provider id "keycloak" → Keycloak directly
      #   - provider id "authop"   → auth-op (VC- or password-backed)
      AUTH_URL: "${RP_EXTERNAL_URL:-http://localhost:7020}"
      NEXTAUTH_URL: "${RP_EXTERNAL_URL:-http://localhost:7020}"
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: "${AUTH_SECRET:-}"
      AUTH_KEYCLOAK_ID: "${RP_KEYCLOAK_CLIENT_ID:-}"
      AUTH_KEYCLOAK_SECRET: "${RP_THEAUSTRALIAHACK_SECRET:-}"
      AUTH_KEYCLOAK_ISSUER: "${RP_KEYCLOAK_ISSUER:-}"
      AUTH_AUTHOP_ID: "${RP_KEYCLOAK_CLIENT_ID:-}"
      AUTH_AUTHOP_SECRET: "${RP_THEAUSTRALIAHACK_SECRET:-}"
      AUTH_AUTHOP_ISSUER: "${RP_AUTHOP_ISSUER:-}"
    ports:
      - "${RP_NEXTJS_PORT:-7020}:3000"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles:
      - identity
      - all
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: ${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME: ${KEYCLOAK_EXTERNAL_URL:-http://localhost:8180}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "${KEYCLOAK_PORT:-8180}:${KEYCLOAK_PORT:-8180}"

  # ==================================================
  # AUTH-OP - Custom OIDC Provider with realm discovery
  # ==================================================
  # Drop-in OIDC OP in front of Keycloak (employees realm via OIDC)
  # and verifier-api2 (citizens realm via OID4VP).
  # External: https://auth-op.theaustraliahack.com
  # Local:    http://localhost:7005
  # ==================================================
  auth-op:
    image: ${IMAGE_PREFIX}waltid/auth-op:${VERSION_TAG:-stable}
    profiles:
      - identity
      - all
    pull_policy: missing
    depends_on:
      - caddy
      - keycloak
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      AUTH_OP_PORT: ${AUTH_OP_PORT:-7005}
      AUTH_OP_ISSUER: ${AUTH_OP_ISSUER:-https://auth-op.theaustraliahack.com}
      EMPLOYEES_OIDC_SECRET: ${EMPLOYEES_OIDC_SECRET}
      RP_THEAUSTRALIAHACK_SECRET: ${RP_THEAUSTRALIAHACK_SECRET}
    volumes:
      # Jib sets WORKDIR=/waltid-auth-op so hoplite resolves config/auth-op.conf
      # relative to that — NOT /app/ (the design doc assumed /app).
      - ./auth-op/config:/waltid-auth-op/config
    ports:
      - "${AUTH_OP_PORT:-7005}:${AUTH_OP_PORT:-7005}"

volumes:
  wallet-api-db:
  vault_data:
  valkey_data:
  verifier-api2-data:
