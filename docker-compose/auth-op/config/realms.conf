# auth-op realms configuration
#
# Defines the authentication realms discoverable at:
#   https://auth-op.theaustraliahack.com/.well-known/openid-configuration
#   https://auth-op.theaustraliahack.com/login/realm/{id}
#
# Two realms shipped by default:
#   - "employees" : OIDC delegation to in-tree Keycloak (issuer realm)
#   - "citizens"  : OID4VP via verifier-api2 using a DCQL query
#
# The EMPLOYEES_OIDC_SECRET env var (see docker-compose/.env) must match the
# client secret of the "auth-op" confidential client registered in Keycloak's
# "issuer" realm. That Keycloak client registration is a separate operator
# step and is NOT shipped as part of this config.

realms = [
  {
    id = "employees"
    name = "Login with your Username or Social ID"
    method = "oidc"
    oidc = {
      issuer = "https://keycloak.theaustraliahack.com/realms/issuer"
      client_id = "auth-op"
      client_secret = ${?EMPLOYEES_OIDC_SECRET}
      scopes = ["openid", "profile", "email"]
    }
    claim_mapping = {
      sub = "$.sub"
      email = "$.email"
      name = "$.name"
      given_name = "$.given_name"
      family_name = "$.family_name"
    }
  },
  {
    id = "citizens"
    name = "Login with your wallet"
    method = "oid4vp"
    oid4vp = {
      verifier_base_url = "https://verifier2.theaustraliahack.com"
      dcql_query_file = "config/dcql/citizens.dcql.json"
      webhook_callback_path = "/login/realm/citizens/webhook"
      # Use the rp.theaustraliahack.com demo RP identity so verifier-api2
      # signs the Request Object with its 2-cert chain (leaf + CA with
      # CA=true) and rewrites response_uri to https://rp.theaustraliahack.com/.
      # The default verifier2 self-signed cert lacks BasicConstraints
      # (CA=ABSENT), which PKIX validators in EUDI wallets reject as an
      # invalid trust anchor.
      rp_id = "a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"
    }
    sub_strategy = "claim_hash"
    sub_source_claims = ["given_name", "family_name", "birth_date"]
    # Claims live at the top level in SD-JWT VC payloads (the format the DCQL
    # in citizens.dcql.json targets across every supported jurisdiction).
    # If W3C VC-JSON-LD is ever mixed in, add a `$.credentialSubject.*`
    # fallback path per claim.
    claim_mapping = {
      given_name = "$.given_name"
      family_name = "$.family_name"
      birth_date = "$.birth_date"
      nationality = "$.nationality"
    }
  }
]
