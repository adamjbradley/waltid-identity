# auth-op realms configuration
#
# Defines the authentication realms discoverable at:
#   https://auth-op.theaustraliahack.com/.well-known/openid-configuration
#   https://auth-op.theaustraliahack.com/login/realm/{id}
#
# Two realms shipped by default:
#   - "employees" : OIDC delegation to in-tree Keycloak (issuer realm)
#   - "citizens"  : OID4VP via verifier-api2 using a DCQL query
#
# The EMPLOYEES_OIDC_SECRET env var (see docker-compose/.env) must match the
# client secret of the "auth-op" confidential client registered in Keycloak's
# "issuer" realm. That Keycloak client registration is a separate operator
# step and is NOT shipped as part of this config.

realms = [
  {
    id = "employees"
    name = "Login with your Username or Social ID"
    method = "oidc"
    oidc = {
      issuer = "https://keycloak.theaustraliahack.com/realms/issuer"
      client_id = "auth-op"
      client_secret = ${?EMPLOYEES_OIDC_SECRET}
      scopes = ["openid", "profile", "email"]
    }
    claim_mapping = {
      sub = "$.sub"
      email = "$.email"
      name = "$.name"
      given_name = "$.given_name"
      family_name = "$.family_name"
    }
  },
  {
    id = "citizens"
    name = "Login with your wallet"
    method = "oid4vp"
    oid4vp = {
      verifier_base_url = "https://verifier2.theaustraliahack.com"
      webhook_callback_path = "/login/realm/citizens/webhook"
      # Use the rp.theaustraliahack.com demo RP identity so verifier-api2
      # signs the Request Object with its 2-cert chain (leaf + CA with
      # CA=true) and rewrites response_uri to https://rp.theaustraliahack.com/.
      # The default verifier2 self-signed cert lacks BasicConstraints
      # (CA=ABSENT), which PKIX validators in EUDI wallets reject as an
      # invalid trust anchor.
      rp_id = "a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"
      # PID VCTs the composed query accepts. One wallet interaction per
      # session — the wallet picks whichever of these it can satisfy.
      vct_values = [
        "urn:eudi:pid:1",
        "urn:au:gov:mygovid:pid:1",
        "urn:in:gov:aadhaar:pid:1",
        "urn:uk:gov:govuk-one-login:pid:1"
      ]
      # Scope catalog — the RP expresses needs via standard OIDC scopes on
      # /authorize; the composer unions claim_paths across requested scopes
      # into a single DCQL credential query. id_token_claim is the only
      # thing that reaches the RP (see
      # docs/plans/2026-04-20-rp-scope-hints-design.md).
      scopes = {
        kyc = {
          claim_paths     = [["given_name"], ["family_name"], ["nationality"]]
          required_claims = ["given_name", "family_name", "nationality"]
          id_token_claim  = "kyc_verified"
          consent_label   = "Identity verified"
        }
        age_over_18 = {
          claim_paths     = [["age_equal_or_over", "18"]]
          required_claims = ["age_over_18"]
          id_token_claim  = "age_over_18"
          consent_label   = "Over 18"
        }
        age_over_21 = {
          claim_paths     = [["age_equal_or_over", "21"]]
          required_claims = ["age_over_21"]
          id_token_claim  = "age_over_21"
          consent_label   = "Over 21"
        }
      }
    }
    sub_strategy = "claim_hash"
    sub_source_claims = ["given_name", "family_name", "nationality"]
    # Claims live at the top level in SD-JWT VC payloads. Map the disclosed
    # claims into the flat shape the consent screen reads and the
    # scope-based projector filters for the id_token. age_over_N flat names
    # match the scope/id_token_claim names so the projector is a one-liner.
    claim_mapping = {
      given_name   = "$.given_name"
      family_name  = "$.family_name"
      nationality  = "$.nationality"
      age_over_18  = "$.age_equal_or_over.18"
      age_over_21  = "$.age_equal_or_over.21"
    }
  }
]
