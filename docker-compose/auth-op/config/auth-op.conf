# Service config for auth-op
# AuthOpServiceConfig — loaded by ConfigManager as 'auth-op'

issuer = "https://auth-op.theaustraliahack.com"
# Overridable via env, HOCON optional substitution
issuer = ${?AUTH_OP_ISSUER}

# Path to the RSA signing key JWK file. Created automatically on first startup if absent.
signingKeyPath = "/waltid-auth-op/config/signing-key.json"

# Cookie Secure flag — set to true when serving over HTTPS externally (via Caddy).
# Note: the docker service itself is HTTP; Caddy handles TLS termination. The browser
# reaches auth-op via https://auth-op.theaustraliahack.com/ so cookies should be Secure.
cookieSecure = true
cookieSecure = ${?AUTH_OP_COOKIE_SECURE}

# Passkey (WebAuthn) support for the citizens realm.
# When this block is omitted, passkey support is disabled end-to-end.
passkey {
    rpId = "auth-op.theaustraliahack.com"
    origin = "https://auth-op.theaustraliahack.com"
    rpName = "The Australia Hack auth-op"
    registryFile = "/waltid-auth-op/data/passkeys.json"
}

# Flow-update callback secret. When absent, the /api/flow-* endpoints and
# the /flow-demo page all 404 (feature off, same convention as passkey).
# n8n workflows must send this value in the X-Flow-Callback-Secret header
# when posting step updates to /api/flow-updates.
flowCallbackSecret = ${?FLOW_CALLBACK_SECRET}
