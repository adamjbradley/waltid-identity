# Service config for auth-op
# AuthOpServiceConfig — loaded by ConfigManager as 'auth-op'

issuer = "https://auth.theaustraliahack.com"
# Overridable via env, HOCON optional substitution
issuer = ${?AUTH_OP_ISSUER}

# Path to the RSA signing key JWK file. Created automatically on first startup if absent.
signingKeyPath = "/app/config/signing-key.json"

# Cookie Secure flag — set to true when serving over HTTPS externally (via Caddy).
# Note: the docker service itself is HTTP; Caddy handles TLS termination. The browser
# reaches auth-op via https://auth.theaustraliahack.com/ so cookies should be Secure.
cookieSecure = true
cookieSecure = ${?AUTH_OP_COOKIE_SECURE}
