# auth-op clients configuration
#
# Confidential OAuth2/OIDC clients recognised by auth-op at its token and
# authorization endpoints. Each entry mirrors the RP entry that would have
# lived in Keycloak's realm-export.json so this OP is a drop-in replacement
# from the RP's perspective (only the issuer URL flips).
#
# The RP_THEAUSTRALIAHACK_SECRET env var (see docker-compose/.env) must match
# whatever secret the RP configures for its keycloak provider.

clients = [
  {
    client_id = "rp_theaustraliahack"
    client_secret = ${?RP_THEAUSTRALIAHACK_SECRET}
    token_endpoint_auth_method = "client_secret_basic"
    redirect_uris = [
      # Paths ending /keycloak and /callback are used when the RPs are flipped
      # to auth-op as a drop-in Keycloak replacement (see INTEGRATION.md).
      "https://rp.theaustraliahack.com/api/auth/callback/keycloak",
      "https://rp.theaustraliahack.com/callback",
      "http://localhost:3000/api/auth/callback/keycloak",
      "http://localhost:7020/api/auth/callback/keycloak",
      "http://localhost:4000/callback",
      # Paths ending /authop and /callback/authop are used when auth-op is
      # ADDED as a parallel login option alongside Keycloak (both available).
      "https://rp.theaustraliahack.com/api/auth/callback/authop",
      "https://rp.theaustraliahack.com/callback/authop",
      "http://localhost:3000/api/auth/callback/authop",
      "http://localhost:7020/api/auth/callback/authop",
      "http://localhost:4000/callback/authop"
    ]
    post_logout_redirect_uris = [
      "https://rp.theaustraliahack.com/*",
      "http://localhost:3000/*",
      "http://localhost:7020/*",
      "http://localhost:4000/*"
    ]
    # Standard OIDC scopes for the employees realm (Keycloak delegation)
    # plus the citizens-realm scope catalog (KYC + age attestations — see
    # docs/plans/2026-04-20-rp-scope-hints-design.md).
    allowed_scopes = ["openid", "profile", "email", "kyc", "age_over_18", "age_over_21"]
    allowed_realms = ["employees", "citizens"]
    # trusted=true bypasses the consent screen — set false so the
    # scope-hints consent UI actually renders for this demo RP.
    trusted = false
  }
]
