# auth-op clients configuration
#
# Confidential OAuth2/OIDC clients recognised by auth-op at its token and
# authorization endpoints. Each entry mirrors the RP entry that would have
# lived in Keycloak's realm-export.json so this OP is a drop-in replacement
# from the RP's perspective (only the issuer URL flips).
#
# The RP_THEAUSTRALIAHACK_SECRET env var (see docker-compose/.env) must match
# whatever secret the RP configures for its keycloak provider.

clients = [
  {
    client_id = "rp_theaustraliahack"
    client_secret = ${?RP_THEAUSTRALIAHACK_SECRET}
    token_endpoint_auth_method = "client_secret_basic"
    redirect_uris = [
      "https://rp.theaustraliahack.com/api/auth/callback/keycloak",
      "https://rp.theaustraliahack.com/callback",
      "http://localhost:3000/api/auth/callback/keycloak",
      "http://localhost:7020/api/auth/callback/keycloak",
      "http://localhost:4000/callback"
    ]
    post_logout_redirect_uris = [
      "https://rp.theaustraliahack.com/*",
      "http://localhost:3000/*",
      "http://localhost:7020/*",
      "http://localhost:4000/*"
    ]
    allowed_scopes = ["openid", "profile", "email"]
    allowed_realms = ["employees", "citizens"]
    trusted = true
  }
]
