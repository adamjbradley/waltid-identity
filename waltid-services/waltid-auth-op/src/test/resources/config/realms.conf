realms = [
  {
    id = "employees"
    name = "Employees"
    method = "oidc"
    oidc = {
      issuer = "https://keycloak.example/realms/issuer"
      client_id = "auth-op"
      client_secret = "s"
      scopes = ["openid", "profile"]
    }
    claim_mapping = {
      sub = "$.sub"
      email = "$.email"
    }
  },
  {
    id = "citizens"
    name = "Citizens"
    method = "oid4vp"
    oid4vp = {
      verifier_base_url = "https://verifier.example"
      dcql_query_file = "config/dcql/citizens.dcql.json"
      webhook_callback_path = "/login/realm/citizens/webhook"
    }
    sub_strategy = "claim_hash"
    claim_mapping = {
      given_name = "$.credentialSubject.given_name"
      family_name = "$.credentialSubject.family_name"
    }
    sub_source_claims = ["given_name", "family_name"]
  }
]
