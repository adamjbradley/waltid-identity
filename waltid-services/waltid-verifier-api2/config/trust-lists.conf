enabled = false
enabled = ${?TRUST_LISTS_ENABLED}

etsi {
    lotlUrl = "https://ec.europa.eu/tools/lotl/eu-lotl.xml"
    lotlUrl = ${?ETSI_LOTL_URL}
    cacheTtlHours = 24
    memberStates = ["*"]
    validateSignatures = true
}

openidFederation {
    # Enable OpenID Federation trust source
    enabled = false
    enabled = ${?OPENID_FEDERATION_ENABLED}

    # Trust anchor entity IDs (federation roots)
    trustAnchors = []
    # Example: trustAnchors = ["https://trust-anchor.example.com"]

    # Maximum trust chain depth (default: 5)
    maxChainDepth = 5

    # Cache TTL in seconds for entity statements (default: 3600 = 1 hour)
    cacheTtlSeconds = 3600
}
